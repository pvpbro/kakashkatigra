<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>АПГРЕЙД ТЕЛЕГРАММ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #0a0a0f;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 16px 16px 20px;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(255, 215, 0, 0.02) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 215, 0, 0.01) 0%, transparent 50%);
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(60deg, rgba(255, 215, 0, 0.03) 0%, rgba(255, 215, 0, 0.03) 100%),
                repeating-linear-gradient(60deg, transparent 0px, transparent 80px, rgba(255, 215, 0, 0.02) 80px, rgba(255, 215, 0, 0.02) 81px),
                repeating-linear-gradient(-60deg, transparent 0px, transparent 80px, rgba(255, 215, 0, 0.02) 80px, rgba(255, 215, 0, 0.02) 81px),
                repeating-linear-gradient(0deg, transparent 0px, transparent 46px, rgba(255, 215, 0, 0.02) 46px, rgba(255, 215, 0, 0.02) 47px);
            background-size: 100% 100%, 160px 160px, 160px 160px, 160px 160px;
            pointer-events: none;
            z-index: 0;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ШАПКА */
        .header {
            text-align: center;
            padding: 10px 0 8px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
        }
        .header .sub {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin-top: 4px;
            font-size: 12px;
            color: #6a6a7a;
        }
        .header .sub .online {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header .sub .online .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4caf50;
            display: inline-block;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.3; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.3; transform: scale(0.9); }
        }
        .header .sub .arrow-up {
            display: inline-block;
            transform: rotate(45deg);
            font-size: 14px;
            color: #ffd700;
        }

        /* КОЛЕСО */
        .wheel-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 0;
        }
        .wheel {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: conic-gradient(from 225deg, #ff6b6b 0%, #ffd93d 50%, #6bcb77 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.1), inset 0 0 40px rgba(0,0,0,0.3);
        }
        .wheel::before {
            content: '';
            position: absolute;
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background: #0a0a0f;
            border: 2px solid rgba(255, 215, 0, 0.1);
        }
        .wheel-inner {
            position: relative;
            z-index: 2;
            text-align: center;
        }
        .wheel-inner .percent {
            font-size: 52px;
            font-weight: 900;
            line-height: 1;
            text-shadow: 0 0 30px rgba(107, 203, 119, 0.2);
        }
        .wheel-inner .label {
            font-size: 11px;
            color: #a0a0b0;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
        }
        .wheel-arrow {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 16px solid #ffd700;
            z-index: 3;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.3));
        }

        /* ДВА БЛОКА ОРУЖИЯ */
        .weapons-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 16px 0;
        }
        .weapon-card {
            background: #14141e;
            border-radius: 16px;
            padding: 16px 12px 14px;
            border: 1px solid rgba(255, 215, 0, 0.05);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            min-height: 160px;
        }
        .weapon-card .model {
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 48px;
            background: radial-gradient(ellipse at center, rgba(255, 215, 0, 0.05) 0%, transparent 70%);
            margin-bottom: 8px;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.1);
            position: relative;
        }
        .weapon-card .model .shine {
            position: absolute;
            top: 10%;
            left: 20%;
            width: 60%;
            height: 30%;
            background: linear-gradient(180deg, rgba(255,215,0,0.05) 0%, transparent 100%);
            border-radius: 50%;
            filter: blur(10px);
        }
        .weapon-card .top-icons {
            display: flex;
            gap: 6px;
            position: absolute;
            top: 10px;
            left: 12px;
            font-size: 14px;
            color: #6a6a7a;
        }
        .weapon-card .title {
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            margin-top: 4px;
            line-height: 1.3;
        }
        .weapon-card .subtitle {
            font-size: 10px;
            color: #6a6a7a;
            margin-top: 2px;
        }

        /* КНОПКА ПРОКАТА + ПОЛЗУНОК */
        .action-bar {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 12px 0 16px;
        }
        .action-bar .btn-roll {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ffd700 0%, #f0b800 100%);
            border: none;
            border-radius: 12px;
            color: #0a0a0f;
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.15);
            transition: all 0.2s;
        }
        .action-bar .btn-roll:active {
            transform: scale(0.96);
        }
        .action-bar .btn-roll .arrow {
            display: inline-block;
            margin-right: 8px;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 4px;
        }
        .slider-row .icon-box {
            font-size: 20px;
            color: #6a6a7a;
        }
        .slider-row .slider-track {
            flex: 1;
            height: 4px;
            background: #2a2a3a;
            border-radius: 2px;
            position: relative;
        }
        .slider-row .slider-track .thumb {
            width: 16px;
            height: 16px;
            background: #ffd700;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            left: 30%;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
            cursor: pointer;
        }
        .slider-row .price {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            min-width: 60px;
            text-align: right;
        }

        /* МНОЖИТЕЛИ */
        .multipliers {
            display: flex;
            gap: 8px;
            margin: 8px 0 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .multipliers .btn-mult {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #2a2a3a;
            background: transparent;
            color: #a0a0b0;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
            min-width: 52px;
            text-align: center;
        }
        .multipliers .btn-mult:active {
            transform: scale(0.92);
        }
        .multipliers .btn-mult.gold {
            border-color: #ffd700;
            color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.05);
        }
        .multipliers .btn-mult.green {
            border-color: #4caf50;
            color: #4caf50;
        }
        .multipliers .btn-mult.red {
            border-color: #ff6b6b;
            color: #ff6b6b;
        }
        .multipliers .btn-mult.settings {
            border-color: transparent;
            font-size: 18px;
            flex: 0 0 40px;
        }

        /* ИНВЕНТАРЬ */
        .inventory-section {
            margin-top: 12px;
        }
        .inventory-tabs {
            display: flex;
            gap: 16px;
            margin-bottom: 8px;
        }
        .inventory-tabs .tab {
            font-size: 14px;
            font-weight: 600;
            color: #6a6a7a;
            padding-bottom: 4px;
            border-bottom: 2px solid transparent;
            cursor: pointer;
        }
        .inventory-tabs .tab.active {
            color: #fff;
            border-bottom-color: #ffd700;
        }
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 10px 0;
            background: rgba(20, 20, 30, 0.4);
            border-radius: 12px;
            min-height: 80px;
            border: 1px solid rgba(255, 215, 0, 0.03);
        }
        .inventory-grid .slot {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: #2a2a3a;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.2s;
        }
        .inventory-grid .slot.filled {
            color: #ffd700;
            border-color: rgba(255, 215, 0, 0.1);
            background: rgba(255, 215, 0, 0.03);
        }
        .inventory-grid .slot.filled:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ШАПКА -->
        <div class="header">
            <h1>АПГРЕЙД ТЕЛЕГРАММ</h1>
            <div class="sub">
                <span class="online"><span class="dot"></span>онлайн</span>
                <span><span class="arrow-up">▲</span> апгрейдов</span>
            </div>
        </div>

        <!-- КОЛЕСО -->
        <div class="wheel-wrapper">
            <div class="wheel" id="wheel">
                <div class="wheel-arrow"></div>
                <div class="wheel-inner">
                    <div class="percent" id="chanceDisplay">50</div>
                    <div class="label">средний шанс</div>
                </div>
            </div>
        </div>

        <!-- ДВА БЛОКА ОРУЖИЯ -->
        <div class="weapons-row">
            <div class="weapon-card" id="leftSlot">
                <div class="top-icons"><span>ℹ️</span><span>⭐</span><span>⭐</span></div>
                <div class="model"><span>🔫</span><div class="shine"></div></div>
                <div class="title" id="leftTitle">Выбери количество звёзд</div>
                <div class="subtitle">В инвентаре или в магазине</div>
            </div>
            <div class="weapon-card" id="rightSlot">
                <div class="model"><span>🔫</span><div class="shine"></div></div>
                <div class="title">Выберите подарок</div>
                <div class="subtitle" style="opacity:0.3;">—</div>
            </div>
        </div>

        <!-- КНОПКА ПРОКАТА + ПОЛЗУНОК -->
        <div class="action-bar">
            <button class="btn-roll" id="rollBtn"><span class="arrow">⤊</span> ПРОКАТЬ</button>
            <div class="slider-row">
                <span class="icon-box">📦</span>
                <div class="slider-track" id="sliderTrack">
                    <div class="thumb" id="sliderThumb"></div>
                </div>
                <span class="price" id="priceDisplay">0.00 ₽</span>
            </div>
        </div>

        <!-- МНОЖИТЕЛИ -->
        <div class="multipliers" id="multipliers">
            <button class="btn-mult" data-mult="2">x2<br><small>50%</small></button>
            <button class="btn-mult" data-mult="4">x4<br><small>25%</small></button>
            <button class="btn-mult" data-mult="8">x8<br><small>12.5%</small></button>
            <button class="btn-mult red" data-chance="30">30%</button>
            <button class="btn-mult gold" data-chance="50">50%</button>
            <button class="btn-mult green" data-chance="70">70%</button>
            <button class="btn-mult settings">⚙️</button>
        </div>

        <!-- ИНВЕНТАРЬ -->
        <div class="inventory-section">
            <div class="inventory-tabs">
                <span class="tab active" data-tab="my">Мои предметы</span>
                <span class="tab" data-tab="reward">Получаемый скин</span>
            </div>
            <div class="inventory-grid" id="inventoryGrid"></div>
        </div>
    </div>

    <script>
        // === Telegram WebApp (только для интерфейса) ===
        const tg = window.Telegram.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            tg.enableClosingConfirmation();
        }

        // === СОСТОЯНИЕ ===
        let state = {
            balance: 100,
            inventory: ['⭐', '⭐', '⭐', null, null, null, null, null],
            level: 1,
            xp: 0,
            chance: 50,
            selectedItem: null,
            currentPrice: 0
        };

        // === ОБНОВЛЕНИЕ КОЛЕСА ===
        function updateWheel(chance) {
            const display = document.getElementById('chanceDisplay');
            display.textContent = chance;
            display.style.color = chance > 70 ? '#6bcb77' : chance > 40 ? '#ffd93d' : '#ff6b6b';
            state.chance = chance;
        }

        // === ОБНОВЛЕНИЕ ЦЕНЫ ===
        function updatePrice(value) {
            document.getElementById('priceDisplay').textContent = `${(value / 100).toFixed(2)} ₽`;
            state.currentPrice = value;
        }

        // === РЕНДЕР ИНВЕНТАРЯ ===
        function renderInventory() {
            const grid = document.getElementById('inventoryGrid');
            grid.innerHTML = '';
            state.inventory.forEach(item => {
                const slot = document.createElement('div');
                slot.className = `slot ${item ? 'filled' : ''}`;
                slot.textContent = item || '+';
                if (item) {
                    slot.addEventListener('click', () => {
                        document.getElementById('leftTitle').textContent = `⭐ ${item} (выбран)`;
                        state.selectedItem = item;
                        if (tg) tg.HapticFeedback.impactOccurred('light');
                    });
                }
                grid.appendChild(slot);
            });
        }

        // === ПОЛЗУНОК ===
        const sliderTrack = document.getElementById('sliderTrack');
        const sliderThumb = document.getElementById('sliderThumb');
        let isDragging = false;

        function getSliderPosition(clientX) {
            const rect = sliderTrack.getBoundingClientRect();
            let x = (clientX - rect.left) / rect.width;
            return Math.max(0, Math.min(1, x));
        }

        function updateSlider(x) {
            const thumbPos = x * 100;
            sliderThumb.style.left = `${thumbPos}%`;
            const value = Math.round(x * state.balance);
            updatePrice(value);
        }

        sliderThumb.addEventListener('mousedown', (e) => { isDragging = true; e.preventDefault(); });
        sliderThumb.addEventListener('touchstart', (e) => {
            isDragging = true;
            e.preventDefault();
            const touch = e.touches[0];
            updateSlider(getSliderPosition(touch.clientX));
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            updateSlider(getSliderPosition(e.clientX));
        });
        document.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const touch = e.touches[0];
            updateSlider(getSliderPosition(touch.clientX));
        });
        document.addEventListener('mouseup', () => { isDragging = false; });
        document.addEventListener('touchend', () => { isDragging = false; });

        sliderTrack.addEventListener('click', (e) => {
            updateSlider(getSliderPosition(e.clientX));
        });

        // === КНОПКА ПРОКАТА ===
        document.getElementById('rollBtn').addEventListener('click', () => {
            const chance = parseInt(document.getElementById('chanceDisplay').textContent);
            const success = Math.random() * 100 < chance;
            const bet = state.currentPrice || 10;

            if (state.balance < bet) {
                if (tg) {
                    tg.showPopup({
                        title: '❌ Недостаточно звёзд!',
                        message: `У тебя ${state.balance} звёзд, нужно ${bet}`,
                        buttons: [{type: 'ok'}]
                    });
                } else {
                    alert(`❌ Недостаточно звёзд! У тебя ${state.balance}, нужно ${bet}`);
                }
                return;
            }

            state.balance -= bet;

            if (success) {
                const emptySlot = state.inventory.indexOf(null);
                if (emptySlot !== -1) {
                    state.inventory[emptySlot] = '⭐';
                    if (tg) {
                        tg.showPopup({
                            title: '🎉 ВЫИГРЫШ!',
                            message: `Ты выиграл предмет! (${bet} звёзд)`,
                            buttons: [{type: 'ok'}]
                        });
                    } else {
                        alert(`🎉 ВЫИГРЫШ! Ты выиграл предмет!`);
                    }
                } else {
                    if (tg) {
                        tg.showPopup({
                            title: '🎉 ВЫИГРЫШ!',
                            message: 'Инвентарь полон!',
                            buttons: [{type: 'ok'}]
                        });
                    } else {
                        alert('🎉 ВЫИГРЫШ! Инвентарь полон!');
                    }
                }
                state.xp += 10;
                if (state.xp >= 100) { state.level++; state.xp = 0; }
            } else {
                if (tg) {
                    tg.showPopup({
                        title: '❌ НЕУДАЧА',
                        message: 'Попробуй ещё раз!',
                        buttons: [{type: 'ok'}]
                    });
                } else {
                    alert('❌ НЕУДАЧА! Попробуй ещё раз.');
                }
            }

            renderInventory();
            updateWheel(state.chance);
            updateSlider(getSliderPosition(window.innerWidth / 2));
        });

        // === МНОЖИТЕЛИ ===
        document.querySelectorAll('.btn-mult[data-mult]').forEach(btn => {
            btn.addEventListener('click', () => {
                const mult = parseInt(btn.dataset.mult);
                state.multiplier = mult;
                updateWheel(Math.round(100 / mult));
                document.querySelectorAll('.btn-mult[data-mult]').forEach(b => b.style.borderColor = '#2a2a3a');
                btn.style.borderColor = '#ffd700';
            });
        });

        document.querySelectorAll('.btn-mult[data-chance]').forEach(btn => {
            btn.addEventListener('click', () => {
                const chance = parseInt(btn.dataset.chance);
                updateWheel(chance);
                document.querySelectorAll('.btn-mult[data-chance]').forEach(b => {
                    b.style.borderColor = '';
                    b.style.boxShadow = 'none';
                });
                btn.style.borderColor = '#ffd700';
                btn.style.boxShadow = '0 0 20px rgba(255,215,0,0.1)';
            });
        });

        // === ТАБЫ ===
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
            });
        });

        // === ИНИЦИАЛИЗАЦИЯ ===
        renderInventory();
        updateWheel(50);
        updatePrice(0);

        // Запоминаем данные для синхронизации (позже)
        window.__state = state;

        console.log('🚀 АПГРЕЙД ТЕЛЕГРАММ загружен!');
    </script>
</body>
</html>
