<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>АПГРЕЙД ТЕЛЕГРАММ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #0a0a0f;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 16px 16px 100px;
            background-image: radial-gradient(circle at 20% 50%, rgba(255, 215, 0, 0.02) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 215, 0, 0.01) 0%, transparent 50%);
        }
        .container { max-width: 480px; margin: 0 auto; }

        .header { text-align: center; padding: 10px 0 8px; position: relative; }
        .header h1 { font-size: 24px; font-weight: 900; color: #fff; letter-spacing: 1.5px; text-transform: uppercase; text-shadow: 0 0 20px rgba(255, 215, 0, 0.1); }
        .balance-display {
            display: inline-block;
            background: rgba(255, 215, 0, 0.1); 
            padding: 8px 24px; 
            border-radius: 20px;
            font-size: 18px; 
            font-weight: 600; 
            color: #ffd700;
            border: 1px solid rgba(255, 215, 0, 0.2);
            margin: 10px 0;
            cursor: pointer;
        }
        .balance-display:active { transform: scale(0.95); }
        .balance-display span { font-size: 32px; font-weight: 900; }
        .header .sub { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 4px; font-size: 12px; color: #6a6a7a; }
        .header .sub .online { display: flex; align-items: center; gap: 6px; }
        .header .sub .online .dot { width: 6px; height: 6px; border-radius: 50%; background: #4caf50; display: inline-block; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.3; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.2); } 100% { opacity: 0.3; transform: scale(0.9); } }

        .wheel-wrapper { display: flex; justify-content: center; align-items: center; padding: 10px 0; }
        .wheel { width: 200px; height: 200px; border-radius: 50%; display: flex; justify-content: center; align-items: center; position: relative; box-shadow: 0 0 40px rgba(255, 215, 0, 0.1), inset 0 0 40px rgba(0,0,0,0.3); }
        .wheel-border { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; z-index: 0; transition: background 0.3s; }
        .wheel-arrow {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(0deg);
            width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent; border-top: 26px solid #ffd700;
            z-index: 3; filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.9));
            transition: transform 1.5s cubic-bezier(0.17, 0.67, 0.83, 0.67);
            pointer-events: none;
        }
        .wheel-arrow::after { content: ''; position: absolute; top: -26px; left: -8px; width: 16px; height: 16px; background: #ffd700; border-radius: 50%; box-shadow: 0 0 30px rgba(255, 215, 0, 0.5); }
        .wheel::before { content: ''; position: absolute; width: 170px; height: 170px; border-radius: 50%; background: #0a0a0f; border: 2px solid rgba(255, 215, 0, 0.1); z-index: 1; }
        .wheel-inner { position: relative; z-index: 2; text-align: center; }
        .wheel-inner .percent { font-size: 52px; font-weight: 900; line-height: 1; text-shadow: 0 0 30px rgba(107, 203, 119, 0.2); }
        .wheel-inner .label { font-size: 11px; color: #a0a0b0; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

        .weapons-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
        .weapon-card { background: #14141e; border-radius: 16px; padding: 16px 12px 14px; border: 1px solid rgba(255, 215, 0, 0.05); box-shadow: 0 4px 20px rgba(0,0,0,0.3); min-height: 170px; transition: border-color 0.3s, box-shadow 0.3s; cursor: pointer; }
        .weapon-card.selected { border-color: #ffd700; box-shadow: 0 0 30px rgba(255, 215, 0, 0.05); }
        .weapon-card .model { width: 100%; height: 80px; display: flex; justify-content: center; align-items: center; background: radial-gradient(ellipse at center, rgba(255, 215, 0, 0.05) 0%, transparent 70%); margin-bottom: 8px; position: relative; }
        .weapon-card .model img { max-width: 80%; max-height: 70px; object-fit: contain; filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.2)); transition: transform 0.3s; }
        .weapon-card .model .empty-icon { font-size: 48px; color: #6a6a7a; opacity: 0.5; }
        .weapon-card .model .shine { position: absolute; top: 10%; left: 20%; width: 60%; height: 30%; background: linear-gradient(180deg, rgba(255,215,0,0.05) 0%, transparent 100%); border-radius: 50%; filter: blur(10px); }
        .weapon-card .top-icons { display: flex; gap: 6px; position: absolute; top: 10px; left: 12px; font-size: 14px; color: #6a6a7a; }
        .weapon-card .title { font-size: 12px; font-weight: 700; color: #fff; margin-top: 4px; line-height: 1.3; text-align: center; }
        .weapon-card .subtitle { font-size: 10px; color: #6a6a7a; margin-top: 2px; text-align: center; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: #1a1a2e; border-radius: 16px; padding: 20px; max-width: 380px; width: 90%; max-height: 70vh; overflow-y: auto; border: 1px solid rgba(255, 215, 0, 0.1); }
        .modal h3 { font-size: 18px; text-align: center; margin-bottom: 12px; color: #ffd700; }
        .modal .item-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .modal .item-option { background: #14141e; border-radius: 12px; padding: 12px 8px; text-align: center; border: 1px solid transparent; cursor: pointer; transition: all 0.2s; }
        .modal .item-option:active { transform: scale(0.92); }
        .modal .item-option.selected { border-color: #ffd700; background: rgba(255, 215, 0, 0.05); }
        .modal .item-option img { width: 48px; height: 48px; object-fit: contain; display: block; margin: 0 auto; }
        .modal .item-option .name { font-size: 11px; color: #a0a0b0; margin-top: 4px; }
        .modal .item-option .price { font-size: 10px; color: #6a6a7a; }
        .modal .close-btn { width: 100%; padding: 10px; background: #2a2a3a; border: none; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 600; margin-top: 12px; cursor: pointer; }

        .action-bar { display: flex; flex-direction: column; gap: 10px; margin: 12px 0 16px; }
        .action-bar .btn-roll { width: 100%; padding: 16px; background: linear-gradient(135deg, #ffd700 0%, #f0b800 100%); border: none; border-radius: 12px; color: #0a0a0f; font-size: 18px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; box-shadow: 0 4px 20px rgba(255, 215, 0, 0.15); transition: all 0.2s; }
        .action-bar .btn-roll:active { transform: scale(0.96); }
        .action-bar .btn-roll:disabled { opacity: 0.5; cursor: not-allowed; }
        .action-bar .btn-roll .arrow { display: inline-block; margin-right: 8px; }

        .slider-row { display: flex; align-items: center; gap: 12px; padding: 0 4px; }
        .slider-row .icon-box { font-size: 20px; color: #6a6a7a; }
        .slider-row .slider-track { flex: 1; height: 4px; background: #2a2a3a; border-radius: 2px; position: relative; }
        .slider-row .slider-track .thumb { width: 16px; height: 16px; background: #ffd700; border-radius: 50%; position: absolute; top: 50%; transform: translateY(-50%); left: 30%; box-shadow: 0 0 20px rgba(255, 215, 0, 0.2); cursor: pointer; }
        .slider-row .price { font-size: 14px; font-weight: 600; color: #fff; min-width: 60px; text-align: right; }

        .multipliers { display: flex; gap: 8px; margin: 8px 0 12px; flex-wrap: wrap; justify-content: center; }
        .multipliers .btn-mult { padding: 8px 12px; border-radius: 8px; border: 1px solid #2a2a3a; background: transparent; color: #a0a0b0; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; flex: 1; min-width: 52px; text-align: center; }
        .multipliers .btn-mult:active { transform: scale(0.92); }
        .multipliers .btn-mult.gold { border-color: #ffd700; color: #ffd700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.05); }
        .multipliers .btn-mult.green { border-color: #4caf50; color: #4caf50; }
        .multipliers .btn-mult.red { border-color: #ff6b6b; color: #ff6b6b; }
        .multipliers .btn-mult.settings { border-color: transparent; font-size: 18px; flex: 0 0 40px; }

        .inventory-section { margin-top: 12px; }
        .inventory-tabs { display: flex; gap: 16px; margin-bottom: 8px; }
        .inventory-tabs .tab { font-size: 14px; font-weight: 600; color: #6a6a7a; padding-bottom: 4px; border-bottom: 2px solid transparent; cursor: pointer; }
        .inventory-tabs .tab.active { color: #fff; border-bottom-color: #ffd700; }
        .inventory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 10px 0; background: rgba(20,20,30,0.4); border-radius: 12px; min-height: 80px; border: 1px solid rgba(255,215,0,0.03); }
        .inventory-grid .slot { aspect-ratio: 1; background: rgba(255,255,255,0.02); border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 24px; color: #2a2a3a; border: 1px solid rgba(255,255,255,0.03); transition: all 0.2s; cursor: pointer; position: relative; }
        .inventory-grid .slot.filled { color: #ffd700; border-color: rgba(255,215,0,0.1); background: rgba(255,215,0,0.03); }
        .inventory-grid .slot.filled:active { transform: scale(0.92); }
        .inventory-grid .slot img { width: 80%; height: 80%; object-fit: contain; filter: drop-shadow(0 0 10px rgba(255,215,0,0.1)); }
        .inventory-grid .slot .empty-icon { font-size: 24px; color: #4a4a5a; }

        .input-modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 200; justify-content: center; align-items: center;
        }
        .input-modal-overlay.active { display: flex; }
        .input-modal { background: #1a1a2e; border-radius: 16px; padding: 20px; max-width: 320px; width: 90%; border: 1px solid rgba(255, 215, 0, 0.1); }
        .input-modal h3 { font-size: 18px; text-align: center; margin-bottom: 12px; color: #ffd700; }
        .input-modal input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #2a2a3a; background: #14141e; color: #fff; font-size: 16px; text-align: center; margin-bottom: 12px; }
        .input-modal .btn-group { display: flex; gap: 8px; }
        .input-modal .btn-group button { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .input-modal .btn-group button:active { transform: scale(0.95); }
        .input-modal .btn-confirm { background: #ffd700; color: #0a0a0f; }
        .input-modal .btn-cancel { background: #2a2a3a; color: #fff; }

        .sync-status {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            padding: 4px 16px;
            border-radius: 12px;
            font-size: 10px;
            background: rgba(0,0,0,0.8);
            border: 1px solid rgba(255,215,0,0.1);
            color: #6a6a7a;
            z-index: 50;
            text-align: center;
        }
        .sync-status.synced { color: #4caf50; border-color: #4caf50; }
        .sync-status.error { color: #ff6b6b; border-color: #ff6b6b; }
        .sync-status.sending { color: #ffd700; border-color: #ffd700; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>АПГРЕЙД ТЕЛЕГРАММ</h1>
            <div class="balance-display" id="balanceDisplay">⭐ <span id="balanceValue">0</span></div>
            <div class="sub">
                <span class="online"><span class="dot"></span>онлайн</span>
                <span><span class="arrow-up">▲</span> апгрейдов</span>
            </div>
        </div>

        <div class="wheel-wrapper">
            <div class="wheel" id="wheel">
                <div class="wheel-border" id="wheelBorder"></div>
                <div class="wheel-arrow" id="arrow"></div>
                <div class="wheel-inner">
                    <div class="percent" id="chanceDisplay">0</div>
                    <div class="label">средний шанс</div>
                </div>
            </div>
        </div>

        <div class="weapons-row">
            <div class="weapon-card" id="leftSlot">
                <div class="top-icons"><span>📦</span></div>
                <div class="model" id="leftModel"><span class="empty-icon">⭐</span><div class="shine"></div></div>
                <div class="title" id="leftTitle">Выбери ставку</div>
                <div class="subtitle" id="leftSub">Кликни на предмет в инвентаре</div>
            </div>

            <div class="weapon-card" id="rightSlot">
                <div class="top-icons"><span>🎯</span></div>
                <div class="model" id="rightModel"><span class="empty-icon">🎁</span><div class="shine"></div></div>
                <div class="title" id="rightTitle">Выбери цель</div>
                <div class="subtitle" id="rightSub">Нажми, чтобы выбрать подарок</div>
            </div>
        </div>

        <div class="action-bar">
            <button class="btn-roll" id="rollBtn" disabled><span class="arrow">⤊</span> ПРОКАТЬ</button>
            <div class="slider-row">
                <span class="icon-box">📦</span>
                <div class="slider-track" id="sliderTrack"><div class="thumb" id="sliderThumb"></div></div>
                <span class="price" id="priceDisplay">0</span>
            </div>
        </div>

        <div class="multipliers">
            <button class="btn-mult" data-mult="2">x2<br><small>×2</small></button>
            <button class="btn-mult" data-mult="4">x4<br><small>×4</small></button>
            <button class="btn-mult" data-mult="8">x8<br><small>×8</small></button>
            <button class="btn-mult red" data-percent="0.3">30%</button>
            <button class="btn-mult gold" data-percent="0.5">50%</button>
            <button class="btn-mult green" data-percent="0.7">70%</button>
            <button class="btn-mult settings">⚙️</button>
        </div>

        <div class="inventory-section">
            <div class="inventory-tabs">
                <span class="tab active" data-tab="my">Мои предметы</span>
                <span class="tab" data-tab="goals">Доступные цели</span>
                <span class="tab" data-tab="sell">Продажа</span>
            </div>
            <div class="inventory-grid" id="inventoryGrid"></div>
        </div>
    </div>

    <div class="modal-overlay" id="goalModal">
        <div class="modal">
            <h3>🎯 Выбери цель</h3>
            <div class="item-list" id="goalList"></div>
            <button class="close-btn" id="closeGoalModal">Закрыть</button>
        </div>
    </div>

    <div class="input-modal-overlay" id="inputModal">
        <div class="input-modal">
            <h3>⭐ Введите количество звёзд</h3>
            <input type="number" id="starsInput" min="1" max="1000" placeholder="Например: 25">
            <div class="btn-group">
                <button class="btn-confirm" id="confirmStars">Подтвердить</button>
                <button class="btn-cancel" id="cancelStars">Отмена</button>
            </div>
        </div>
    </div>

    <div class="sync-status" id="syncStatus">🔄 синхронизация...</div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) { tg.ready(); tg.expand(); tg.enableClosingConfirmation(); }

        // === ПОЛУЧАЕМ ДАННЫЕ ОТ БОТА ===
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id');
        let balance = parseInt(urlParams.get('balance')) || 0;
        let inventory = JSON.parse(urlParams.get('inventory') || '[]');

        // === ЗАГРУЗКА ИЗ LOCALSTORAGE ===
        function loadFromLocalStorage() {
            if (!userId) return;
            try {
                const savedBalance = localStorage.getItem(`game_balance_${userId}`);
                if (savedBalance !== null) {
                    balance = parseInt(savedBalance);
                    document.getElementById('balanceValue').textContent = balance;
                    console.log('📥 Загружено из localStorage:', balance);
                }
                const savedInventory = localStorage.getItem(`game_inventory_${userId}`);
                if (savedInventory !== null) {
                    inventory = JSON.parse(savedInventory);
                }
            } catch(e) {
                console.error('❌ Ошибка загрузки:', e);
            }
        }

        // === СОХРАНЕНИЕ В LOCALSTORAGE ===
        function saveToLocalStorage() {
            if (!userId) return;
            try {
                localStorage.setItem(`game_balance_${userId}`, balance);
                localStorage.setItem(`game_inventory_${userId}`, JSON.stringify(inventory));
                console.log('💾 Сохранено в localStorage, баланс:', balance);
            } catch(e) {
                console.error('❌ Ошибка сохранения:', e);
            }
        }

        // === ОТПРАВКА В БОТА ===
        function sendToBot(action = 'sync_balance', data = {}) {
            if (!userId || !window.Telegram?.WebApp) return;
            
            const payload = {
                action: action,
                userId: userId,
                balance: balance,
                timestamp: Date.now(),
                ...data
            };
            
            try {
                window.Telegram.WebApp.sendData(JSON.stringify(payload));
                document.getElementById('syncStatus').textContent = '✅ синхронизировано';
                document.getElementById('syncStatus').className = 'sync-status synced';
                console.log('📤 Отправлено боту:', payload);
            } catch(e) {
                document.getElementById('syncStatus').textContent = '❌ ошибка';
                document.getElementById('syncStatus').className = 'sync-status error';
                console.error('❌ Ошибка отправки:', e);
            }
        }

        // === ОБНОВЛЕНИЕ БАЛАНСА ===
        function updateBalance(newBalance) {
            if (newBalance === balance) return;
            balance = newBalance;
            document.getElementById('balanceValue').textContent = balance;
            saveToLocalStorage();
            sendToBot('sync_balance', { balance: balance });
            updateChance();
        }

        // === ВСЯ ОСТАЛЬНАЯ ЛОГИКА ИГРЫ ===
        const AVAILABLE_GOALS = [
            { id: 'gift15', name: 'Подарок 15⭐', icon: '🎁', price: 15, image: 'gift15' },
            { id: 'gift25', name: 'Подарок 25⭐', icon: '🎁', price: 25, image: 'gift25' },
            { id: 'gift50', name: 'Подарок 50⭐', icon: '🎁', price: 50, image: 'gift50' },
            { id: 'gift100_1', name: 'Подарок 100⭐ #1', icon: '🎁', price: 100, image: 'gift100' },
            { id: 'gift100_2', name: 'Подарок 100⭐ #2', icon: '🎁', price: 100, image: 'gift100_2' },
        ];

        let state = {
            leftItem: null,
            rightItem: null,
            chance: 0,
            isSpinning: false,
            extraStars: 0,
            totalBet: 0
        };

        function loadImageToElement(element, imageName, fallback) {
            if (!element) return;
            if (!imageName) {
                element.innerHTML = `<span style="font-size:48px;">${fallback}</span>`;
                return;
            }
            const ext = ['.png', '.jpg', '.jpeg'];
            let loaded = false;
            function tryLoad(index) {
                if (index >= ext.length) {
                    element.innerHTML = `<span style="font-size:48px;">${fallback}</span>`;
                    return;
                }
                const img = new Image();
                img.onload = function() { element.innerHTML = `<img src="${imageName}${ext[index]}" alt="item">`; loaded = true; };
                img.onerror = function() { if (!loaded) tryLoad(index + 1); };
                img.src = imageName + ext[index];
            }
            tryLoad(0);
        }

        function calculateChance() {
            const bet = state.leftItem?.price || 0;
            const extra = state.extraStars || 0;
            const totalBet = bet + extra;
            const goalPrice = state.rightItem?.price || 0;
            if (!goalPrice || goalPrice <= 0) return 0;
            if (!totalBet || totalBet <= 0) return 0;
            let chance = (totalBet / goalPrice) * 100;
            if (chance > 100) chance = 100;
            return Math.round(chance);
        }

        function updateWheelBorder(chance) {
            const border = document.getElementById('wheelBorder');
            const green = chance;
            const red = 100 - chance;
            border.style.background = `conic-gradient(from 225deg, #ff6b6b 0%, #ff6b6b ${red}%, #6bcb77 ${red}%, #6bcb77 100%)`;
        }

        function updateWheel(chance) {
            const display = document.getElementById('chanceDisplay');
            display.textContent = chance;
            display.style.color = chance > 70 ? '#6bcb77' : chance > 40 ? '#ffd93d' : '#ff6b6b';
            state.chance = chance;
            updateWheelBorder(chance);
        }

        function updateChance() {
            const chance = calculateChance();
            updateWheel(chance);
        }

        function updatePrice(value) {
            document.getElementById('priceDisplay').textContent = value;
            const bet = state.leftItem?.price || 0;
            const extra = Math.max(0, value - bet);
            state.extraStars = extra;
            state.totalBet = bet + extra;
            updateChance();
            if (state.rightItem) {
                const extraText = extra > 0 ? ` +${extra}⭐` : '';
                document.getElementById('rightSub').textContent = `Цена: ${state.rightItem.price} звёзд${extraText}`;
            }
        }

        function updateLeftBlock(item) {
            const model = document.getElementById('leftModel');
            const title = document.getElementById('leftTitle');
            const sub = document.getElementById('leftSub');
            const slot = document.getElementById('leftSlot');

            if (item) {
                if (item.image) {
                    loadImageToElement(model, item.image, item.icon || '⭐');
                } else {
                    model.innerHTML = `<span style="font-size:48px;">${item.icon || '⭐'}</span>`;
                }
                title.textContent = item.name || 'Ставка';
                sub.textContent = `💰 ${item.price} звёзд`;
                slot.classList.add('selected');
                state.leftItem = item;
                document.getElementById('rollBtn').disabled = false;
                const sliderValue = item.price + state.extraStars;
                updateSliderPosition(sliderValue);
                updatePrice(sliderValue);
            } else {
                model.innerHTML = `<span class="empty-icon">⭐</span><div class="shine"></div>`;
                title.textContent = 'Выбери ставку';
                sub.textContent = 'Кликни на предмет в инвентаре';
                slot.classList.remove('selected');
                state.leftItem = null;
                state.extraStars = 0;
                state.totalBet = 0;
                document.getElementById('rollBtn').disabled = true;
                updateSliderPosition(0);
                updatePrice(0);
                updateChance();
            }
        }

        function updateRightBlock(item) {
            const model = document.getElementById('rightModel');
            const title = document.getElementById('rightTitle');
            const sub = document.getElementById('rightSub');
            const slot = document.getElementById('rightSlot');

            if (item) {
                if (item.image) {
                    loadImageToElement(model, item.image, item.icon || '🎁');
                } else {
                    model.innerHTML = `<span style="font-size:48px;">${item.icon || '🎁'}</span>`;
                }
                title.textContent = item.name || 'Цель';
                const extraText = state.extraStars > 0 ? ` +${state.extraStars}⭐` : '';
                sub.textContent = item.price ? `Цена: ${item.price} звёзд${extraText}` : 'Выбери цель';
                slot.classList.add('selected');
                state.rightItem = item;
            } else {
                model.innerHTML = `<span class="empty-icon">🎁</span><div class="shine"></div>`;
                title.textContent = 'Выбери цель';
                sub.textContent = 'Нажми, чтобы выбрать подарок';
                slot.classList.remove('selected');
                state.rightItem = null;
            }
            updateChance();
        }

        function renderInventory(tab = 'my') {
            const grid = document.getElementById('inventoryGrid');
            grid.innerHTML = '';

            let items = [];
            if (tab === 'my') {
                items = inventory;
            } else if (tab === 'goals') {
                items = AVAILABLE_GOALS.map(g => ({ ...g, isGoal: true }));
            } else if (tab === 'sell') {
                items = inventory.map(g => ({ ...g, isSell: true }));
            }

            if (items.length === 0) {
                const empty = document.createElement('div');
                empty.style.cssText = 'grid-column: 1/-1; text-align: center; padding: 20px; color: #6a6a7a;';
                empty.textContent = tab === 'sell' ? 'Нет предметов для продажи' : 'Пусто';
                grid.appendChild(empty);
                return;
            }

            items.forEach((item, index) => {
                const slot = document.createElement('div');
                slot.className = `slot filled`;

                if (item.image) {
                    const img = document.createElement('img');
                    const ext = ['.png', '.jpg', '.jpeg'];
                    let loaded = false;
                    function tryLoad(i) {
                        if (i >= ext.length) return;
                        const testImg = new Image();
                        testImg.onload = function() { img.src = item.image + ext[i]; loaded = true; };
                        testImg.onerror = function() { if (!loaded) tryLoad(i + 1); };
                        testImg.src = item.image + ext[i];
                    }
                    tryLoad(0);
                    img.alt = item.name || 'Предмет';
                    img.onerror = function() { this.style.display = 'none'; };
                    slot.appendChild(img);
                } else {
                    slot.textContent = item.icon || '⭐';
                }

                if (tab === 'my') {
                    slot.addEventListener('click', () => {
                        const leftItem = { 
                            ...item, 
                            type: 'gift', 
                            price: item.price || 0,
                            inventoryIndex: index 
                        };
                        updateLeftBlock(leftItem);
                        document.querySelectorAll('.slot').forEach(s => s.style.borderColor = '');
                        slot.style.borderColor = '#ffd700';
                        tg?.HapticFeedback.impactOccurred('light');
                    });
                } else if (tab === 'goals') {
                    slot.addEventListener('click', () => {
                        if (balance >= item.price) {
                            const newBalance = balance - item.price;
                            inventory.push({ ...item });
                            updateBalance(newBalance);
                            renderInventory('my');
                            sendToBot('add_item', { item: item, balance: newBalance });
                            tg?.showPopup({ title: '✅ Куплено!', message: `Ты купил ${item.name}!`, buttons: [{ type: 'ok' }] });
                        } else {
                            tg?.showPopup({ title: '❌', message: `Недостаточно звёзд! Нужно ${item.price}`, buttons: [{ type: 'ok' }] });
                        }
                    });
                } else if (tab === 'sell') {
                    slot.addEventListener('click', () => {
                        const price = item.price;
                        const newBalance = balance + price;
                        inventory.splice(index, 1);
                        updateBalance(newBalance);
                        sendToBot('remove_item', { item_id: item.id, balance: newBalance });
                        renderInventory('sell');
                        tg?.showPopup({ title: '💰 Продано!', message: `Ты продал ${item.name} за ${price}⭐`, buttons: [{ type: 'ok' }] });
                    });
                }

                if (tab === 'goals') {
                    const priceLabel = document.createElement('div');
                    priceLabel.style.cssText = 'position:absolute;bottom:4px;right:4px;font-size:10px;color:#ffd700;';
                    priceLabel.textContent = `${item.price}⭐`;
                    slot.appendChild(priceLabel);
                } else if (tab === 'sell') {
                    const priceLabel = document.createElement('div');
                    priceLabel.style.cssText = 'position:absolute;bottom:4px;right:4px;font-size:10px;color:#6bcb77;';
                    priceLabel.textContent = `💰${item.price}`;
                    slot.appendChild(priceLabel);
                }

                grid.appendChild(slot);
            });
        }

        function renderGoals() {
            const list = document.getElementById('goalList');
            list.innerHTML = '';

            const allGoals = [...AVAILABLE_GOALS];
            allGoals.push({
                id: 'stars_goal',
                name: 'Звёзды (на баланс)',
                icon: '⭐',
                price: 0,
                image: null,
                type: 'stars'
            });

            allGoals.forEach(goal => {
                const div = document.createElement('div');
                div.className = `item-option ${state.rightItem?.id === goal.id ? 'selected' : ''}`;

                if (goal.image) {
                    const img = document.createElement('img');
                    const ext = ['.png', '.jpg', '.jpeg'];
                    let loaded = false;
                    function tryLoad(i) {
                        if (i >= ext.length) return;
                        const testImg = new Image();
                        testImg.onload = function() { img.src = goal.image + ext[i]; loaded = true; };
                        testImg.onerror = function() { if (!loaded) tryLoad(i + 1); };
                        testImg.src = goal.image + ext[i];
                    }
                    tryLoad(0);
                    img.alt = goal.name;
                    img.onerror = function() { this.style.display = 'none'; };
                    div.appendChild(img);
                } else {
                    const span = document.createElement('span');
                    span.style.fontSize = '32px';
                    span.textContent = goal.icon || '⭐';
                    div.appendChild(span);
                }

                const name = document.createElement('div');
                name.className = 'name';
                name.textContent = goal.name;
                div.appendChild(name);

                if (goal.price > 0) {
                    const price = document.createElement('div');
                    price.className = 'price';
                    price.textContent = `${goal.price} ⭐`;
                    div.appendChild(price);
                }

                div.addEventListener('click', () => {
                    updateRightBlock(goal);
                    document.getElementById('goalModal').classList.remove('active');
                    tg?.HapticFeedback.impactOccurred('medium');
                });
                list.appendChild(div);
            });
        }

        // === ПОЛЗУНОК ===
        const sliderTrack = document.getElementById('sliderTrack');
        const sliderThumb = document.getElementById('sliderThumb');
        let isDragging = false;
        let currentSliderValue = 0;

        function getSliderPosition(clientX) {
            const rect = sliderTrack.getBoundingClientRect();
            let x = (clientX - rect.left) / rect.width;
            return Math.max(0, Math.min(1, x));
        }

        function updateSliderPosition(value) {
            const maxValue = 100;
            const x = Math.min(1, value / maxValue);
            sliderThumb.style.left = `${x * 100}%`;
            currentSliderValue = Math.round(x * 100);
            document.getElementById('priceDisplay').textContent = currentSliderValue;
        }

        function updateSliderFromPosition(x) {
            const value = Math.round(x * 100);
            currentSliderValue = value;
            sliderThumb.style.left = `${x * 100}%`;
            document.getElementById('priceDisplay').textContent = value;
            
            const bet = state.leftItem?.price || 0;
            const extra = Math.max(0, value - bet);
            state.extraStars = extra;
            state.totalBet = bet + extra;
            
            updateChance();
            
            if (state.rightItem) {
                const extraText = extra > 0 ? ` +${extra}⭐` : '';
                document.getElementById('rightSub').textContent = `Цена: ${state.rightItem.price} звёзд${extraText}`;
            }
            
            if (state.leftItem) {
                document.getElementById('leftSub').textContent = `💰 ${state.leftItem.price}⭐ + ${extra}⭐ = ${state.leftItem.price + extra}⭐`;
            }
        }

        sliderThumb.addEventListener('mousedown', (e) => { isDragging = true; e.preventDefault(); });
        sliderThumb.addEventListener('touchstart', (e) => {
            isDragging = true; e.preventDefault();
            const touch = e.touches[0];
            updateSliderFromPosition(getSliderPosition(touch.clientX));
        });
        document.addEventListener('mousemove', (e) => { if (!isDragging) return; updateSliderFromPosition(getSliderPosition(e.clientX)); });
        document.addEventListener('touchmove', (e) => { if (!isDragging) return; const touch = e.touches[0]; updateSliderFromPosition(getSliderPosition(touch.clientX)); });
        document.addEventListener('mouseup', () => { isDragging = false; });
        document.addEventListener('touchend', () => { isDragging = false; });
        sliderTrack.addEventListener('click', (e) => { updateSliderFromPosition(getSliderPosition(e.clientX)); });

        // === МОДАЛКА ПОПОЛНЕНИЯ ===
        document.getElementById('balanceDisplay').addEventListener('click', () => {
            document.getElementById('inputModal').classList.add('active');
            document.getElementById('starsInput').value = '';
            document.getElementById('starsInput').focus();
        });

        document.getElementById('confirmStars').addEventListener('click', () => {
            const input = document.getElementById('starsInput');
            const value = parseInt(input.value);
            if (!isNaN(value) && value > 0) {
                if (value > balance) {
                    tg?.showPopup({ title: '❌', message: `Недостаточно звёзд! Доступно: ${balance}`, buttons: [{ type: 'ok' }] });
                } else {
                    const newBalance = balance - value;
                    state.extraStars += value;
                    updateBalance(newBalance);
                    updateChance();
                    tg?.showPopup({ title: '✅', message: `Добавлено ${value}⭐`, buttons: [{ type: 'ok' }] });
                    if (state.rightItem) {
                        const extraText = state.extraStars > 0 ? ` +${state.extraStars}⭐` : '';
                        document.getElementById('rightSub').textContent = `Цена: ${state.rightItem.price} звёзд${extraText}`;
                    }
                }
            } else {
                tg?.showPopup({ title: '⚠️', message: 'Введите корректное число!', buttons: [{ type: 'ok' }] });
            }
            document.getElementById('inputModal').classList.remove('active');
        });

        document.getElementById('cancelStars').addEventListener('click', () => {
            document.getElementById('inputModal').classList.remove('active');
        });

        document.getElementById('inputModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                document.getElementById('inputModal').classList.remove('active');
            }
        });

        // === КНОПКА ПРОКАТА ===
        document.getElementById('rollBtn').addEventListener('click', async function() {
            if (state.isSpinning) return;
            if (!state.leftItem) {
                tg?.showPopup({ title: '⚠️', message: 'Выбери ставку!', buttons: [{ type: 'ok' }] });
                return;
            }
            if (!state.rightItem) {
                tg?.showPopup({ title: '⚠️', message: 'Выбери цель!', buttons: [{ type: 'ok' }] });
                return;
            }

            const bet = state.leftItem.price || 0;
            const extra = state.extraStars || 0;
            const totalBet = bet + extra;
            
            if (balance < totalBet) {
                tg?.showPopup({ title: '❌', message: `Нужно ${totalBet} звёзд, у тебя ${balance}`, buttons: [{ type: 'ok' }] });
                return;
            }

            state.isSpinning = true;
            const btn = document.getElementById('rollBtn');
            btn.disabled = true;

            try {
                const rand = Math.random() * 100;
                const success = rand < state.chance;

                console.log(`🎲 Шанс: ${state.chance}%, Рандом: ${rand.toFixed(2)}, Результат: ${success ? 'ВЫИГРЫШ' : 'ПРОИГРЫШ'}`);

                const arrow = document.getElementById('arrow');
                const wheel = document.getElementById('wheel');

                let targetDeg;
                if (success) {
                    const greenPercent = Math.random() * state.chance;
                    targetDeg = 360 * (greenPercent / 100);
                } else {
                    const start = state.chance;
                    const redPercent = start + Math.random() * (100 - start);
                    targetDeg = 360 * (redPercent / 100);
                }

                const currentDeg = parseFloat(arrow.dataset.deg) || 0;
                const newDeg = currentDeg + 720 + targetDeg;
                arrow.dataset.deg = newDeg;
                arrow.style.transform = `translate(-50%, -50%) rotate(${newDeg}deg)`;

                await new Promise(resolve => setTimeout(resolve, 1500));

                const leftItemRef = state.leftItem;
                const rightItemRef = state.rightItem;
                const leftIndex = state.leftItem.inventoryIndex;
                
                let newBalance = balance - totalBet;
                
                if (leftIndex !== undefined && leftIndex < inventory.length) {
                    inventory.splice(leftIndex, 1);
                }

                if (success) {
                    if (rightItemRef.type === 'gift') {
                        inventory.push({ ...rightItemRef });
                        sendToBot('add_item', { item: rightItemRef, balance: newBalance });
                    } else {
                        newBalance += rightItemRef.price;
                        sendToBot('sync_balance', { balance: newBalance });
                    }
                    updateBalance(newBalance);
                    saveToLocalStorage();
                    tg?.showPopup({ 
                        title: '🎉 ВЫИГРЫШ!', 
                        message: `Ты получил ${rightItemRef.name}!`, 
                        buttons: [{ type: 'ok' }] 
                    });
                } else {
                    updateBalance(newBalance);
                    saveToLocalStorage();
                    tg?.showPopup({ 
                        title: '❌ НЕУДАЧА', 
                        message: `Ставка ${leftItemRef.name} сгорела!`, 
                        buttons: [{ type: 'ok' }] 
                    });
                }

                state.extraStars = 0;
                updateLeftBlock(null);
                updateRightBlock(null);
                renderInventory('my');
                updateChance();
                updateSliderPosition(0);

            } catch (error) {
                console.error('Ошибка:', error);
            } finally {
                state.isSpinning = false;
                btn.disabled = false;
            }
        });

        // === МНОЖИТЕЛИ ===
        document.querySelectorAll('.btn-mult[data-mult]').forEach(btn => {
            btn.addEventListener('click', () => {
                const mult = parseInt(btn.dataset.mult);
                if (!state.leftItem) {
                    tg?.showPopup({ title: '⚠️', message: 'Сначала выбери ставку!', buttons: [{ type: 'ok' }] });
                    return;
                }
                
                const basePrice = state.leftItem.price;
                let newPrice = Math.round(basePrice * mult);
                let goal = AVAILABLE_GOALS.find(g => g.price === newPrice);
                if (!goal) {
                    goal = {
                        id: `stars_${newPrice}`,
                        name: `${newPrice}⭐`,
                        icon: '⭐',
                        price: newPrice,
                        image: null,
                        type: 'stars'
                    };
                }
                updateRightBlock(goal);
                document.querySelectorAll('.btn-mult[data-mult]').forEach(b => b.style.borderColor = '#2a2a3a');
                btn.style.borderColor = '#ffd700';
            });
        });

        document.querySelectorAll('.btn-mult[data-percent]').forEach(btn => {
            btn.addEventListener('click', () => {
                const percent = parseFloat(btn.dataset.percent);
                if (!state.leftItem) {
                    tg?.showPopup({ title: '⚠️', message: 'Сначала выбери ставку!', buttons: [{ type: 'ok' }] });
                    return;
                }
                
                const basePrice = state.leftItem.price;
                let newPrice = Math.round(basePrice * percent);
                let goal = AVAILABLE_GOALS.find(g => g.price === newPrice);
                if (!goal) {
                    goal = {
                        id: `stars_${newPrice}`,
                        name: `${newPrice}⭐`,
                        icon: '⭐',
                        price: newPrice,
                        image: null,
                        type: 'stars'
                    };
                }
                updateRightBlock(goal);
                document.querySelectorAll('.btn-mult[data-percent]').forEach(b => {
                    b.style.borderColor = '';
                    b.style.boxShadow = 'none';
                });
                btn.style.borderColor = '#ffd700';
                btn.style.boxShadow = '0 0 20px rgba(255, 215, 0, 0.1)';
            });
        });

        // === ПРАВЫЙ БЛОК ===
        document.getElementById('rightSlot').addEventListener('click', () => {
            renderGoals();
            document.getElementById('goalModal').classList.add('active');
        });

        document.getElementById('closeGoalModal').addEventListener('click', () => {
            document.getElementById('goalModal').classList.remove('active');
        });
        document.getElementById('goalModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                document.getElementById('goalModal').classList.remove('active');
            }
        });

        // === ТАБЫ ===
        let currentTab = 'my';
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentTab = tab.dataset.tab;
                renderInventory(currentTab);
            });
        });

        // === ИНИЦИАЛИЗАЦИЯ ===
        function init() {
            console.log('🚀 ИНИЦИАЛИЗАЦИЯ...');
            
            // Загружаем из localStorage
            loadFromLocalStorage();
            
            // Обновляем UI
            document.getElementById('balanceValue').textContent = balance;
            
            // Проверяем инвентарь
            if (inventory.length === 0) {
                inventory = [
                    { id: 'gift15', name: 'Подарок 15⭐', icon: '🎁', price: 15, image: 'gift15' }
                ];
                saveToLocalStorage();
            }
            
            renderInventory('my');
            updateWheel(0);
            updateSliderPosition(0);
            updateLeftBlock(null);
            updateRightBlock(null);
            updateChance();
            
            // Отправляем начальный баланс боту
            setTimeout(() => {
                if (userId) {
                    sendToBot('sync_balance', { balance: balance });
                }
            }, 1000);
            
            // Периодическая синхронизация (каждые 5 секунд)
            setInterval(() => {
                if (userId) {
                    // Проверяем localStorage
                    try {
                        const savedBalance = localStorage.getItem(`game_balance_${userId}`);
                        if (savedBalance !== null) {
                            const saved = parseInt(savedBalance);
                            if (saved !== balance) {
                                balance = saved;
                                document.getElementById('balanceValue').textContent = balance;
                                updateChance();
                            }
                        }
                    } catch(e) {}
                    sendToBot('sync_balance', { balance: balance });
                }
            }, 5000);
            
            console.log('🚀 ЗАГРУЗКА ЗАВЕРШЕНА, БАЛАНС:', balance);
            document.getElementById('syncStatus').textContent = '✅ синхронизировано';
            document.getElementById('syncStatus').className = 'sync-status synced';
        }

        // === ЗАПУСК ===
        init();

        // === ПРИ ЗАКРЫТИИ ===
        window.addEventListener('beforeunload', function() {
            if (userId) {
                saveToLocalStorage();
                sendToBot('sync_balance', { balance: balance, final: true });
            }
        });

        console.log('🚀 АПГРЕЙД ТЕЛЕГРАММ загружен!');
        console.log('👤 user_id:', userId);
        console.log('💰 balance:', balance);
        console.log('📦 inventory:', inventory);
    </script>
</body>
  </html>
