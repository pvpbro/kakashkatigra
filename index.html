<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>АПГРЕЙД ТЕЛЕГРАММ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #0a0a0f;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 16px 16px 20px;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(255, 215, 0, 0.02) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 215, 0, 0.01) 0%, transparent 50%);
        }
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(60deg, rgba(255, 215, 0, 0.03) 0%, rgba(255, 215, 0, 0.03) 100%),
                repeating-linear-gradient(60deg, transparent 0px, transparent 80px, rgba(255, 215, 0, 0.02) 80px, rgba(255, 215, 0, 0.02) 81px),
                repeating-linear-gradient(-60deg, transparent 0px, transparent 80px, rgba(255, 215, 0, 0.02) 80px, rgba(255, 215, 0, 0.02) 81px),
                repeating-linear-gradient(0deg, transparent 0px, transparent 46px, rgba(255, 215, 0, 0.02) 46px, rgba(255, 215, 0, 0.02) 47px);
            background-size: 100% 100%, 160px 160px, 160px 160px, 160px 160px;
            pointer-events: none; z-index: 0;
        }
        .container { max-width: 480px; margin: 0 auto; position: relative; z-index: 1; }

        .header { text-align: center; padding: 10px 0 8px; }
        .header h1 { font-size: 24px; font-weight: 900; color: #fff; letter-spacing: 1.5px; text-transform: uppercase; text-shadow: 0 0 20px rgba(255, 215, 0, 0.1); }
        .header .sub { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 4px; font-size: 12px; color: #6a6a7a; }
        .header .sub .online { display: flex; align-items: center; gap: 6px; }
        .header .sub .online .dot { width: 6px; height: 6px; border-radius: 50%; background: #4caf50; display: inline-block; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.3; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.2); } 100% { opacity: 0.3; transform: scale(0.9); } }
        .header .sub .arrow-up { display: inline-block; transform: rotate(45deg); font-size: 14px; color: #ffd700; }

        .wheel-wrapper { display: flex; justify-content: center; align-items: center; padding: 10px 0; position: relative; }
        .wheel { width: 200px; height: 200px; border-radius: 50%; display: flex; justify-content: center; align-items: center; position: relative; box-shadow: 0 0 40px rgba(255, 215, 0, 0.1), inset 0 0 40px rgba(0,0,0,0.3); }
        .wheel-border { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; transition: background 0.3s; z-index: 0; }
        .wheel.spinning .wheel-border { animation: spinBorder 1.5s ease-in-out; }
        @keyframes spinBorder { 0% { transform: rotate(0deg); } 100% { transform: rotate(720deg); } }
        .wheel-arrow { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 16px solid #ffd700; z-index: 3; filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.3)); }
        .wheel::before { content: ''; position: absolute; width: 170px; height: 170px; border-radius: 50%; background: #0a0a0f; border: 2px solid rgba(255, 215, 0, 0.1); z-index: 1; }
        .wheel-inner { position: relative; z-index: 2; text-align: center; }
        .wheel-inner .percent { font-size: 52px; font-weight: 900; line-height: 1; text-shadow: 0 0 30px rgba(107, 203, 119, 0.2); }
        .wheel-inner .label { font-size: 11px; color: #a0a0b0; text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

        .weapons-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
        .weapon-card { background: #14141e; border-radius: 16px; padding: 16px 12px 14px; border: 1px solid rgba(255, 215, 0, 0.05); box-shadow: 0 4px 20px rgba(0,0,0,0.3); position: relative; overflow: hidden; min-height: 170px; transition: border-color 0.3s, box-shadow 0.3s; }
        .weapon-card.selected { border-color: #ffd700; box-shadow: 0 0 30px rgba(255, 215, 0, 0.05); }
        .weapon-card .model { width: 100%; height: 80px; display: flex; justify-content: center; align-items: center; background: radial-gradient(ellipse at center, rgba(255, 215, 0, 0.05) 0%, transparent 70%); margin-bottom: 8px; position: relative; }
        .weapon-card .model img { max-width: 80%; max-height: 70px; object-fit: contain; filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.2)); transition: transform 0.3s; }
        .weapon-card .model img:active { transform: scale(0.9); }
        .weapon-card .model .empty-icon { font-size: 48px; color: #6a6a7a; opacity: 0.5; }
        .weapon-card .model .shine { position: absolute; top: 10%; left: 20%; width: 60%; height: 30%; background: linear-gradient(180deg, rgba(255,215,0,0.05) 0%, transparent 100%); border-radius: 50%; filter: blur(10px); }
        .weapon-card .top-icons { display: flex; gap: 6px; position: absolute; top: 10px; left: 12px; font-size: 14px; color: #6a6a7a; }
        .weapon-card .title { font-size: 12px; font-weight: 700; color: #fff; margin-top: 4px; line-height: 1.3; }
        .weapon-card .subtitle { font-size: 10px; color: #6a6a7a; margin-top: 2px; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: #1a1a2e; border-radius: 16px; padding: 20px; max-width: 380px; width: 90%; max-height: 70vh; overflow-y: auto; border: 1px solid rgba(255, 215, 0, 0.1); }
        .modal h3 { font-size: 18px; text-align: center; margin-bottom: 12px; color: #ffd700; }
        .modal .item-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .modal .item-option { background: #14141e; border-radius: 12px; padding: 12px 8px; text-align: center; border: 1px solid transparent; cursor: pointer; transition: all 0.2s; }
        .modal .item-option:active { transform: scale(0.92); }
        .modal .item-option.selected { border-color: #ffd700; background: rgba(255, 215, 0, 0.05); }
        .modal .item-option img { width: 48px; height: 48px; object-fit: contain; display: block; margin: 0 auto; }
        .modal .item-option .name { font-size: 11px; color: #a0a0b0; margin-top: 4px; }
        .modal .item-option .price { font-size: 10px; color: #6a6a7a; }
        .modal .close-btn { width: 100%; padding: 10px; background: #2a2a3a; border: none; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 600; margin-top: 12px; cursor: pointer; }
        .modal .close-btn:active { transform: scale(0.95); }

        .action-bar { display: flex; flex-direction: column; gap: 10px; margin: 12px 0 16px; }
        .action-bar .btn-roll { width: 100%; padding: 16px; background: linear-gradient(135deg, #ffd700 0%, #f0b800 100%); border: none; border-radius: 12px; color: #0a0a0f; font-size: 18px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; box-shadow: 0 4px 20px rgba(255, 215, 0, 0.15); transition: all 0.2s; }
        .action-bar .btn-roll:active { transform: scale(0.96); }
        .action-bar .btn-roll:disabled { opacity: 0.5; cursor: not-allowed; }
        .action-bar .btn-roll .arrow { display: inline-block; margin-right: 8px; }

        .slider-row { display: flex; align-items: center; gap: 12px; padding: 0 4px; }
        .slider-row .icon-box { font-size: 20px; color: #6a6a7a; }
        .slider-row .slider-track { flex: 1; height: 4px; background: #2a2a3a; border-radius: 2px; position: relative; }
        .slider-row .slider-track .thumb { width: 16px; height: 16px; background: #ffd700; border-radius: 50%; position: absolute; top: 50%; transform: translateY(-50%); left: 30%; box-shadow: 0 0 20px rgba(255, 215, 0, 0.2); cursor: pointer; }
        .slider-row .price { font-size: 14px; font-weight: 600; color: #fff; min-width: 60px; text-align: right; }

        .multipliers { display: flex; gap: 8px; margin: 8px 0 12px; flex-wrap: wrap; justify-content: center; }
        .multipliers .btn-mult { padding: 8px 12px; border-radius: 8px; border: 1px solid #2a2a3a; background: transparent; color: #a0a0b0; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; flex: 1; min-width: 52px; text-align: center; }
        .multipliers .btn-mult:active { transform: scale(0.92); }
        .multipliers .btn-mult.gold { border-color: #ffd700; color: #ffd700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.05); }
        .multipliers .btn-mult.green { border-color: #4caf50; color: #4caf50; }
        .multipliers .btn-mult.red { border-color: #ff6b6b; color: #ff6b6b; }
        .multipliers .btn-mult.settings { border-color: transparent; font-size: 18px; flex: 0 0 40px; }

        .inventory-section { margin-top: 12px; }
        .inventory-tabs { display: flex; gap: 16px; margin-bottom: 8px; }
        .inventory-tabs .tab { font-size: 14px; font-weight: 600; color: #6a6a7a; padding-bottom: 4px; border-bottom: 2px solid transparent; cursor: pointer; }
        .inventory-tabs .tab.active { color: #fff; border-bottom-color: #ffd700; }
        .inventory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 10px 0; background: rgba(20, 20, 30, 0.4); border-radius: 12px; min-height: 80px; border: 1px solid rgba(255, 215, 0, 0.03); }
        .inventory-grid .slot { aspect-ratio: 1; background: rgba(255, 255, 255, 0.02); border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 24px; color: #2a2a3a; border: 1px solid rgba(255, 255, 255, 0.03); transition: all 0.2s; cursor: pointer; position: relative; }
        .inventory-grid .slot.filled { color: #ffd700; border-color: rgba(255, 215, 0, 0.1); background: rgba(255, 215, 0, 0.03); }
        .inventory-grid .slot.filled:active { transform: scale(0.92); }
        .inventory-grid .slot img { width: 80%; height: 80%; object-fit: contain; filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.1)); }
        .inventory-grid .slot .empty-icon { font-size: 24px; color: #4a4a5a; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>АПГРЕЙД ТЕЛЕГРАММ</h1>
            <div class="sub">
                <span class="online"><span class="dot"></span>онлайн</span>
                <span><span class="arrow-up">▲</span> апгрейдов</span>
            </div>
        </div>

        <div class="wheel-wrapper">
            <div class="wheel" id="wheel">
                <div class="wheel-border" id="wheelBorder"></div>
                <div class="wheel-arrow" id="arrow"></div>
                <div class="wheel-inner">
                    <div class="percent" id="chanceDisplay">0</div>
                    <div class="label">средний шанс</div>
                </div>
            </div>
        </div>

        <div class="weapons-row">
            <div class="weapon-card" id="leftSlot">
                <div class="top-icons"><span>📦</span></div>
                <div class="model" id="leftModel"><span class="empty-icon">⭐</span><div class="shine"></div></div>
                <div class="title" id="leftTitle">Выбери предмет</div>
                <div class="subtitle" id="leftSub">Кликни на предмет в инвентаре</div>
            </div>

            <div class="weapon-card" id="rightSlot">
                <div class="top-icons"><span>🎯</span></div>
                <div class="model" id="rightModel"><span class="empty-icon">🎁</span><div class="shine"></div></div>
                <div class="title" id="rightTitle">Выбери цель</div>
                <div class="subtitle" id="rightSub">Нажми, чтобы выбрать подарок</div>
            </div>
        </div>

        <div class="action-bar">
            <button class="btn-roll" id="rollBtn" disabled><span class="arrow">⤊</span> ПРОКАТЬ</button>
            <div class="slider-row">
                <span class="icon-box">📦</span>
                <div class="slider-track" id="sliderTrack"><div class="thumb" id="sliderThumb"></div></div>
                <span class="price" id="priceDisplay">0.00 ₽</span>
            </div>
        </div>

        <div class="multipliers">
            <button class="btn-mult" data-mult="2">x2<br><small>50%</small></button>
            <button class="btn-mult" data-mult="4">x4<br><small>25%</small></button>
            <button class="btn-mult" data-mult="8">x8<br><small>12.5%</small></button>
            <button class="btn-mult red" data-chance="30">30%</button>
            <button class="btn-mult gold" data-chance="50">50%</button>
            <button class="btn-mult green" data-chance="70">70%</button>
            <button class="btn-mult settings">⚙️</button>
        </div>

        <div class="inventory-section">
            <div class="inventory-tabs">
                <span class="tab active" data-tab="my">Мои предметы</span>
                <span class="tab" data-tab="goals">Доступные цели</span>
            </div>
            <div class="inventory-grid" id="inventoryGrid"></div>
        </div>
    </div>

    <div class="modal-overlay" id="goalModal">
        <div class="modal">
            <h3>🎯 Выбери цель апгрейда</h3>
            <div class="item-list" id="goalList"></div>
            <button class="close-btn" id="closeGoalModal">Закрыть</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) { tg.ready(); tg.expand(); tg.enableClosingConfirmation(); }

        let state = {
            balance: 100,
            inventory: [
                { id: 'star10', name: '10⭐', icon: '⭐', price: 10, image: null },
                { id: 'star15', name: '15⭐', icon: '⭐', price: 15, image: null },
                { id: 'star20', name: '20⭐', icon: '⭐', price: 20, image: null },
                null, null, null, null, null
            ],
            leftItem: null,
            rightItem: null,
            chance: 0,
            currentPrice: 0,
            isSpinning: false
        };

        const INITIAL_GOALS = [
            { id: 'gift15', name: 'Подарок 15⭐', icon: '🎁', price: 15, image: 'gift15' },
            { id: 'gift100', name: 'Подарок 100⭐', icon: '🎁', price: 100, image: 'gift100' },
        ];

        function loadImageToElement(element, imageName, fallback) {
            if (!element) return;
            if (!imageName) {
                element.innerHTML = `<span style="font-size:48px;">${fallback}</span>`;
                return;
            }
            const ext = ['.png', '.jpg', '.jpeg'];
            let loaded = false;
            function tryLoad(index) {
                if (index >= ext.length) {
                    element.innerHTML = `<span style="font-size:48px;">${fallback}</span>`;
                    return;
                }
                const img = new Image();
                img.onload = function() { element.innerHTML = `<img src="${imageName}${ext[index]}" alt="item">`; loaded = true; };
                img.onerror = function() { if (!loaded) tryLoad(index + 1); };
                img.src = imageName + ext[index];
            }
            tryLoad(0);
        }

        function updateWheel(chance) {
            const display = document.getElementById('chanceDisplay');
            display.textContent = chance;
            display.style.color = chance > 70 ? '#6bcb77' : chance > 40 ? '#ffd93d' : '#ff6b6b';
            state.chance = chance;
            const border = document.getElementById('wheelBorder');
            const green = chance;
            const red = 100 - chance;
            border.style.background = `conic-gradient(from 225deg, #ff6b6b 0%, #ff6b6b ${red}%, #6bcb77 ${red}%, #6bcb77 100%)`;
        }

        function updateChance() {
            const bet = state.leftItem?.price || 0;
            const goalPrice = state.rightItem?.price || 0;
            if (!goalPrice || goalPrice <= 0) { updateWheel(0); return; }
            if (!bet || bet <= 0) { updateWheel(0); return; }
            let chance = (bet / goalPrice) * 100;
            if (chance > 100) chance = 100;
            updateWheel(Math.round(chance));
        }

        function updatePrice(value) {
            document.getElementById('priceDisplay').textContent = `${(value / 100).toFixed(2)} ₽`;
            state.currentPrice = value;
        }

        function updateLeftBlock(item) {
            const model = document.getElementById('leftModel');
            const title = document.getElementById('leftTitle');
            const sub = document.getElementById('leftSub');
            const slot = document.getElementById('leftSlot');

            if (item) {
                loadImageToElement(model, item.image, item.icon || '⭐');
                title.textContent = item.name || 'Предмет';
                sub.textContent = item.price ? `${item.price} звёзд` : 'В инвентаре';
                slot.classList.add('selected');
                state.leftItem = item;
                document.getElementById('rollBtn').disabled = false;
            } else {
                loadImageToElement(model, null, '⭐');
                title.textContent = 'Выбери предмет';
                sub.textContent = 'Кликни на предмет в инвентаре';
                slot.classList.remove('selected');
                state.leftItem = null;
                document.getElementById('rollBtn').disabled = true;
            }
            updateChance();
        }

        function updateRightBlock(item) {
            const model = document.getElementById('rightModel');
            const title = document.getElementById('rightTitle');
            const sub = document.getElementById('rightSub');
            const slot = document.getElementById('rightSlot');

            if (item) {
                loadImageToElement(model, item.image, item.icon || '🎁');
                title.textContent = item.name || 'Цель';
                sub.textContent = item.price ? `Цена: ${item.price} звёзд` : 'Выбери цель';
                slot.classList.add('selected');
                state.rightItem = item;
            } else {
                loadImageToElement(model, null, '🎁');
                title.textContent = 'Выбери цель';
                sub.textContent = 'Нажми, чтобы выбрать подарок';
                slot.classList.remove('selected');
                state.rightItem = null;
            }
            updateChance();
        }

        function renderInventory() {
            const grid = document.getElementById('inventoryGrid');
            grid.innerHTML = '';

            state.inventory.forEach((item, index) => {
                const slot = document.createElement('div');
                slot.className = `slot ${item ? 'filled' : ''}`;
                
                if (item) {
                    if (item.image) {
                        const img = document.createElement('img');
                        const ext = ['.png', '.jpg', '.jpeg'];
                        let loaded = false;
                        function tryLoad(i) {
                            if (i >= ext.length) return;
                            const testImg = new Image();
                            testImg.onload = function() { img.src = item.image + ext[i]; loaded = true; };
                            testImg.onerror = function() { if (!loaded) tryLoad(i + 1); };
                            testImg.src = item.image + ext[i];
                        }
                        tryLoad(0);
                        img.alt = item.name || 'Предмет';
                        img.onerror = function() { this.style.display = 'none'; };
                        slot.appendChild(img);
                    } else {
                        slot.textContent = item.icon || '⭐';
                    }
                    slot.addEventListener('click', () => {
                        const selectedItem = { ...item, inventoryIndex: index };
                        updateLeftBlock(selectedItem);
                        document.querySelectorAll('.slot').forEach(s => s.style.borderColor = '');
                        slot.style.borderColor = '#ffd700';
                        tg?.HapticFeedback.impactOccurred('light');
                    });
                } else {
                    const empty = document.createElement('span');
                    empty.className = 'empty-icon';
                    empty.textContent = '+';
                    slot.appendChild(empty);
                }
                grid.appendChild(slot);
            });
        }

        function renderGoals() {
            const list = document.getElementById('goalList');
            list.innerHTML = '';

            INITIAL_GOALS.forEach(goal => {
                const div = document.createElement('div');
                div.className = `item-option ${state.rightItem?.id === goal.id ? 'selected' : ''}`;
                const img = document.createElement('img');
                img.alt = goal.name;
                const ext = ['.png', '.jpg', '.jpeg'];
                let loaded = false;
                function tryLoad(i) {
                    if (i >= ext.length) return;
                    const testImg = new Image();
                    testImg.onload = function() { img.src = goal.image + ext[i]; loaded = true; };
                    testImg.onerror = function() { if (!loaded) tryLoad(i + 1); };
                    testImg.src = goal.image + ext[i];
                }
                tryLoad(0);
                img.onerror = function() { this.style.display = 'none'; };
                div.appendChild(img);
                const name = document.createElement('div');
                name.className = 'name';
                name.textContent = goal.name;
                div.appendChild(name);
                const price = document.createElement('div');
                price.className = 'price';
                price.textContent = `${goal.price} ⭐`;
                div.appendChild(price);
                div.addEventListener('click', () => {
                    updateRightBlock(goal);
                    document.getElementById('goalModal').classList.remove('active');
                    tg?.HapticFeedback.impactOccurred('medium');
                });
                list.appendChild(div);
            });
        }

        // === ПОЛЗУНОК ===
        const sliderTrack = document.getElementById('sliderTrack');
        const sliderThumb = document.getElementById('sliderThumb');
        let isDragging = false;

        function getSliderPosition(clientX) {
            const rect = sliderTrack.getBoundingClientRect();
            let x = (clientX - rect.left) / rect.width;
            return Math.max(0, Math.min(1, x));
        }

        function updateSlider(x) {
            const thumbPos = x * 100;
            sliderThumb.style.left = `${thumbPos}%`;
            const value = Math.round(x * state.balance);
            updatePrice(value);
        }

        sliderThumb.addEventListener('mousedown', (e) => { isDragging = true; e.preventDefault(); });
        sliderThumb.addEventListener('touchstart', (e) => {
            isDragging = true; e.preventDefault();
            const touch = e.touches[0];
            updateSlider(getSliderPosition(touch.clientX));
        });
        document.addEventListener('mousemove', (e) => { if (!isDragging) return; updateSlider(getSliderPosition(e.clientX)); });
        document.addEventListener('touchmove', (e) => { if (!isDragging) return; const touch = e.touches[0]; updateSlider(getSliderPosition(touch.clientX)); });
        document.addEventListener('mouseup', () => { isDragging = false; });
        document.addEventListener('touchend', () => { isDragging = false; });
        sliderTrack.addEventListener('click', (e) => { updateSlider(getSliderPosition(e.clientX)); });

        // === КНОПКА ПРОКАТА ===
        document.getElementById('rollBtn').addEventListener('click', async () => {
            if (state.isSpinning) return;
            if (!state.leftItem) {
                tg?.showPopup({ title: '⚠️', message: 'Выбери предмет!', buttons: [{type: 'ok'}] });
                return;
            }
            if (!state.rightItem) {
                tg?.showPopup({ title: '⚠️', message: 'Выбери цель!', buttons: [{type: 'ok'}] });
                return;
            }

            const bet = state.leftItem.price || 0;
            if (state.balance < bet) {
                tg?.showPopup({ title: '❌', message: `Нужно ${bet} звёзд`, buttons: [{type: 'ok'}] });
                return;
            }

            state.isSpinning = true;
            const btn = document.getElementById('rollBtn');
            btn.disabled = true;

            const wheel = document.getElementById('wheel');
            const arrow = document.getElementById('arrow');

            // === РАНДОМНЫЙ РЕЗУЛЬТАТ ===
            const rand = Math.random() * 100;
            const success = rand < state.chance;

            // === РАНДОМНАЯ ПОЗИЦИЯ СТРЕЛКИ ===
            let targetPercent;
            if (success) {
                targetPercent = Math.random() * state.chance;
            } else {
                targetPercent = state.chance + Math.random() * (100 - state.chance);
            }
            const targetDeg = (targetPercent / 100) * 360;
            const currentDeg = parseFloat(arrow.dataset.deg) || 0;
            const newDeg = currentDeg + 720 + targetDeg;
            arrow.dataset.deg = newDeg;
            arrow.style.transform = `translateX(-50%) rotate(${newDeg}deg)`;

            wheel.classList.add('spinning');
            await new Promise(resolve => setTimeout(resolve, 1500));
            wheel.classList.remove('spinning');

            // === ОБРАБОТКА ===
            if (success) {
                state.balance -= bet;
                const idx = state.leftItem.inventoryIndex;
                if (idx !== undefined) {
                    state.inventory[idx] = null;
                }
                const emptySlot = state.inventory.indexOf(null);
                if (emptySlot !== -1) {
                    state.inventory[emptySlot] = {
                        id: state.rightItem.id + '_' + Date.now(),
                        name: state.rightItem.name,
                        icon: state.rightItem.icon || '🎁',
                        price: state.rightItem.price,
                        image: state.rightItem.image || null
                    };
                }
                updateLeftBlock(null);
                renderInventory();
                tg?.showPopup({ title: '🎉 ВЫИГРЫШ!', message: `Ты получил ${state.rightItem.name}!`, buttons: [{type: 'ok'}] });
            } else {
                state.balance -= bet;
                const idx = state.leftItem.inventoryIndex;
                if (idx !== undefined) {
                    state.inventory[idx] = null;
                }
                updateLeftBlock(null);
                renderInventory();
                tg?.showPopup({ title: '❌ НЕУДАЧА', message: 'Предмет сгорел!', buttons: [{type: 'ok'}] });
            }

            state.isSpinning = false;
            btn.disabled = false;
            updateSlider(0);
            updateChance();
        });

        // === МНОЖИТЕЛИ ===
        document.querySelectorAll('.btn-mult[data-mult]').forEach(btn => {
            btn.addEventListener('click', () => {
                const mult = parseInt(btn.dataset.mult);
                const chance = Math.round(100 / mult);
                updateWheel(chance);
                document.querySelectorAll('.btn-mult[data-mult]').forEach(b => b.style.borderColor = '#2a2a3a');
                btn.style.borderColor = '#ffd700';
            });
        });

        document.querySelectorAll('.btn-mult[data-chance]').forEach(btn => {
            btn.addEventListener('click', () => {
                const chance = parseInt(btn.dataset.chance);
                updateWheel(chance);
                document.querySelectorAll('.btn-mult[data-chance]').forEach(b => {
                    b.style.borderColor = '';
                    b.style.boxShadow = 'none';
                });
                btn.style.borderColor = '#ffd700';
                btn.style.boxShadow = '0 0 20px rgba(255,215,0,0.1)';
            });
        });

        // === ПОПАП ===
        document.getElementById('rightSlot').addEventListener('click', () => {
            renderGoals();
            document.getElementById('goalModal').classList.add('active');
        });

        document.getElementById('closeGoalModal').addEventListener('click', () => {
            document.getElementById('goalModal').classList.remove('active');
        });
        document.getElementById('goalModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                document.getElementById('goalModal').classList.remove('active');
            }
        });

        // === ТАБЫ ===
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
            });
        });

        // === ИНИЦИАЛИЗАЦИЯ ===
        renderInventory();
        updateWheel(0);
        updatePrice(0);
        updateLeftBlock(null);
        updateRightBlock(null);
        updateChance();

        console.log('🚀 АПГРЕЙД ТЕЛЕГРАММ загружен!');
    </script>
</body>
  </html>
